name: Build release PDFs

on:
  release:
    types: [created]

permissions:
  contents: write
  id-token: write

env:
  TYPST_IMAGE: ghcr.io/typst/typst:0.15.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile top-level Typst files
        run: ./make-all.sh

      - name: Zip PDFs
        run: |
          cd output
          zip "../nih-system-${{ github.event.release.tag_name }}.zip" *.pdf

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "nih-system-${{ github.event.release.tag_name }}.zip" \
            --repo "${{ github.repository }}" --clobber
  deploy-web:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - name: Convert to html
        run: ./site/build.sh
      
      - name: Zip dist
        run: |
          cd site/out
          zip -r "../nih-system-web-${{ github.event.release.tag_name }}.zip" *
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::197626722975:role/Github-Actions-SSM
          aws-region: us-east-2

        
